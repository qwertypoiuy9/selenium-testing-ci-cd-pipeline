<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniCollege | Login</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        MiniCollege
    </div>

    <nav>

        <a href="/index.html">
            Home
        </a>

        <a href="/login.html">
            Login
        </a>

        <a href="/about.html">
            About
        </a>

    </nav>

</header>


<main class="login-page">

    <div class="login-card">

        <div class="login-icon">
            🎓
        </div>

        <h1>Student Login</h1>

        <p class="login-subtitle">
            Login to access your student dashboard
        </p>


        <form id="loginForm">

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                id="loginButton"
                type="submit"
                class="primary-btn full-width">
                Login
            </button>

        </form>


        <div
            id="errorMessage"
            class="message error-message">
        </div>


        <div class="demo-info">

            <strong>Demo Credentials</strong>

            <p>
                Username: <b>student</b>
            </p>

            <p>
                Password: <b>student123</b>
            </p>

        </div>

    </div>

</main>


<script src="/js/script.js"></script>

</body>

</html>
